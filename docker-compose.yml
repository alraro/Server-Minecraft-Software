networks:
  minecraft-net:
  proxy_net:
    external: true

services:
  minecraft:
    image: itzg/minecraft-server:java21
    tty: true
    stdin_open: true
    container_name: server-software-fauna
    environment:
      EULA: "TRUE"
      TYPE: "NEOFORGE"
      NEOFORGE_VERSION: "21.1.211"
      MOTD: "    \u00A7a\u00A7l¡Server del Software! \u00A7f- \u00A7c[NeoForge 1.21.1]\u00A7r\n          \u00A76\u00A7kaaaa\u00A76 » \u00A7e\u00A7lFauna & Orchestra \u00A76« \u00A76\u00A7kaaaa"
      VERSION: "1.21.1"
      MEMORY: "${MC_MEMORY}"
      ALLOW_FLIGHT: "TRUE"
      MAX_TICK_TIME: "-1"
      DIFFICULTY: "hard"
      MODE: "survival"
      ONLINE_MODE: "FALSE"
      ENABLE_COMMAND_BLOCK: "TRUE"
      SPAWN_PROTECTION: "0"
      PVP: "TRUE"
      SERVER_NAME: "Servidor de Software"
      LEVEL_TYPE: "minecraft:large_biomes"
      ICON: "/server-icon/server-icon.png"

      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_PORT: "${RCON_PORT}"

      PACKWIZ_URL: "https://raw.githubusercontent.com/alraro/Server-Minecraft-Software/refs/heads/develop/my-packwiz/pack.toml"

    networks:
      - minecraft-net
      - proxy_net

    volumes:
      - ./minecraft-data:/data
      - ./my-packwiz/excluded_mods:/mods
      - ./my-packwiz:/packwiz:ro
      - ./server-icon.png:/server-icon/server-icon.png

    restart: "on-failure"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: "on-failure"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=/prometheus/'  # <--- LA CLAVE ES ESTA LÍNEA
    networks:
      - minecraft-net
      - proxy_net
    depends_on:
      - minecraft

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: "on-failure"
    environment:
      - GF_SERVER_ROOT_URL=http://ocidashboard.duckdns.org/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      # Un volumen para que tus dashboards y configs sobrevivan
      - grafana-data:/var/lib/grafana
    # --- AÑADIR A LA RED ---
    networks:
      - minecraft-net
      - proxy_net
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - loki-data:/loki
    networks:
      - minecraft-net
      - proxy_net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 3. Los logs de los contenedores
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - minecraft-net
      - proxy_net
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
